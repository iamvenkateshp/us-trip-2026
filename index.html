       padding-right:calc(var(--pad) + env(safe-area-inset-right))}
  header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.97);
    border-bottom:1px solid var(--line);padding:10px var(--pad);backdrop-filter:blur(8px)}

  .sub{color:var(--dim);font-size:12px;margin-top:2px}

  nav::-webkit-scrollbar{display:none}
  nav{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);

  nav button{flex:0 0 auto;background:var(--card);color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
  nav button.on{background:var(--accent);color:#08131f;border-color:var(--accent)}
  main{padding:var(--pad)}
  section{display:none} section.on{display:block}
  .day{background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin-bottom:12px;overflow:hidden}
  .day>summary{padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer;
    list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .day>summary::-webkit-details-marker{display:none}
  .day>summary::after{content:"▾";color:var(--dim);font-size:13px;transition:.2s}
  .day[open]>summary::after{transform:rotate(180deg)}
  .day .body{padding:0 14px 12px;border-top:1px solid var(--line);padding-top:10px}
  .when{color:var(--accent);font-size:12px;font-weight:700;display:block;margin-bottom:1px}
  .item{padding:11px 0;border-bottom:1px dashed var(--line)}
  .item:last-child{border-bottom:0}
  .t{color:var(--accent);font-weight:700;font-size:14px;margin-right:7px}
  .note{color:var(--dim);font-size:14.5px;margin-top:4px}
  .warn{color:var(--warn)} .bad{color:var(--bad)} .good{color:var(--good)}
  a.map{display:inline-block;margin-top:6px;background:var(--card2);color:var(--accent);
    border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;
    text-decoration:none;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px;margin-bottom:11px}
  .card h3{margin:0 0 7px;font-size:14.5px}
  .k{color:var(--dim);font-size:13.5px}
  .big{font-size:19px;font-weight:800}
  #nearBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:30;
    background:var(--accent);color:#08131f;border:0;border-radius:999px;
    padding:13px 24px;font-size:15px;font-weight:800;
    box-shadow:0 6px 20px rgba(0,0,0,.5)}
  #nearBtn:disabled{opacity:.6}
  .dist{color:var(--good);font-weight:800;font-size:12.5px}
  .empty{color:var(--dim);text-align:center;padding:28px 10px;font-size:14px}
  ul{margin:6px 0;padding-left:19px} li{margin:5px 0;font-size:14.5px}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);
    border-radius:6px;padding:1px 7px;font-size:11.5px;color:var(--dim);margin-right:5px}
  label.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
    border-bottom:1px dashed var(--line);font-size:14px;cursor:pointer}
  label.chk:last-of-type{border-bottom:0}
  label.chk input{margin-top:3px;width:19px;height:19px;flex:0 0 auto;accent-color:var(--good)}
  label.chk.on span{color:var(--dim);text-decoration:line-through}
  label.chk.money{align-items:center}
  label.chk.money.on b{color:var(--dim);text-decoration:line-through}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;background:var(--card);color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}

    background:var(--card);color:var(--text);font-size:15px;margin-bottom:11px}
  .route{background:var(--card2);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;margin:8px 0}

  textarea.dayNote{width:100%;margin-top:10px;min-height:54px;padding:10px;
    border-radius:9px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);font-size:14px;font-family:inherit;resize:vertical}
  .noteWrap{position:relative}
  .noteFlag{position:absolute;right:10px;bottom:9px;font-size:12px;font-weight:700;
    opacity:0;transition:opacity .25s;pointer-events:none}
</style>

 {h:"🔴 Before you fly — the three that matter",b:`<ul>
 <li><b>UK visa with the £500 Priority upgrade.</b> Britain scrapped transit-without-visa in Feb 2026. Standard processing returns a decision <b>two days after your flight leaves</b> — the 15-day clock starts at your VFS biometrics appointment, not at submission.</li>
 <li><b>Fix the Emirates seats.</b> 45A/45C and 45K/45H are <b>not adjacent</b> — the 777-300ER is 3-4-3, lettered A·B·C | D·E·F·G | H·J·K, so a stranger sits between your wife and daughter for 13 hours, twice. Free to change in Manage Booking.</li>
 <li><b>Pick the Delta seats — or find out you can't.</b> DL324 Boston→Seattle on 17 Sep is booked (PNR [PNR]) but <b>both seat numbers show "–"</b>. Open Delta My Trips and try to choose seats. <b>If it lets you, you're on Main Cabin — pick two together and you're done.</b> If it says seats are assigned at check-in, it's <b>Basic Economy</b>. 🔴 <b>Correction to earlier advice: you CANNOT pay to upgrade Basic Economy to Main Cabin after booking</b> — Delta doesn't sell that. If it's Basic, the plan is to check in the instant the 24-hour window opens, not to buy your way out.</li></ul>`},
 {h:"🚗 Car seat",b:`your daughter is <b>16 kg (35 lb)</b> — <b>too light for a booster</b> (they need 40 lb). She needs a <b>5-point harness seat</b>.<br><br>
 <b>Borrow your brother's and have your wife carry it from Boston on 17 Sep.</b> Car seats fly free and don't count against any allowance.<br><br>
 Ask him: is it a harness not a booster? Can he spare it 17–27 Sep? What's the expiry date on the shell?<br><br>
 <span class="bad">Uber Car Seat does NOT exist in Buffalo and isn't reliable in Newark</span> — exactly the rides you need it for. If a car turns up without a seat, don't get in; use a licensed taxi.`},
 {h:"🧳 Baggage",b:`<b>You:</b> BA Premium Economy = 2 × 23 kg checked + cabin bag + personal item. Carrying one 23 kg case throughout leaves a whole allowance free for the way home.<br><br>
 <b>Your wife:</b> 4 × 23 kg dropped in Boston on 12 Sep, then cabin-only for all three domestic flights.<br><br>
 Total bag fees ≈ <b>$80</b>, not the $300–450 I first budgeted.<br><br>
 <b>✅ Delta DL324 (17 Sep) — the "0 PC / 0 Kgs" on your voucher is not a restriction.</b>
 Delta US domestic gives a <b>full carry-on (22×14×9 in) plus a personal item on every fare, Basic Economy included</b> — Delta is the one that kept this. "0 PC" just means no free <i>checked</i> bag, which is true of all Delta domestic fares (first bag is now $45 each way). The car seat flies free on top.<br><br>
 <span class="bad">⚠️ But if that ticket is Basic Economy, they board LAST — and the bins are often full by then.</span>
 The roller bag may get gate-checked. It's free, but you won't see it again until Seattle — so pack
 <b>everything you need in flight into the personal item</b>: snacks, wipes, a change of clothes for
 your daughter, medicines, chargers, the tablet. Treat the roller as hold luggage that happens to start in the cabin.<br><br>
 <span class="bad">Separate risk: United Basic Economy on Buffalo → Newark has NO cabin bag at all.</span> That's United's rule, not Delta's. Buy a fare above it or her whole plan collapses.`},
 {h:"💳 Money and tipping",b:`<ul>
 <li>Always choose to be charged in <b>USD</b>, never INR — dynamic currency conversion is a bad rate.</li>
 <li><b>Fuel pumps ask for a US ZIP code</b> and will reject your card. Pay the cashier inside.</li>
 <li>Restaurants 18–20% · taxis/Uber 15–18% · housekeeping $3–5/night · <b>counter service: no tip needed</b>, "no tip" on the screen is fine.</li>
 <li>Sales tax is added at the till, not on the shelf price.</li></ul>`},
 {h:"🚈 Getting around",b:`<b>Seattle:</b> Link 2 Line, flat $3, your daughter free (WA: under-18s free). Opened March 2026 — you do not need a car.<br><br>
 <b>New York:</b> tap a contactless card, buy nothing. Subway $3.00 capped at $35/week; PATH $3.25 and does <b>not</b> cap. They cap separately. MetroCard was retired in Jan 2026. <span class="good">your daughter rides free — at 41.5" she's under the 44" limit.</span><br><br>
 <b>Boston:</b> MBTA $2.40, under-11s free.<br><br>

 {h:"🏥 If someone falls ill — read this before you need it",b:`
 <div class="item"><b>Urgent care, NOT the emergency room</b>
 <div class="note">The same sore throat costs about <b>$250 at an urgent care</b> and about
 <b>$2,000 in an ER</b> — roughly ten times more. This is the most expensive decision an Indian
 family makes in America, and it comes up far more often than a real emergency does.</div></div>
 <div class="item"><b>Emergency room</b><div class="note">Genuine emergencies only — breathing
 difficulty, serious injury, a fit. Otherwise you're paying ten times over.</div></div>
 <div class="item"><b>Retail clinic</b> (CVS MinuteClinic, Walgreens)
 <div class="note">Cheapest, for minor things.</div></div>
 <div class="note" style="margin-top:10px">Named clinics and paediatric ERs for every base are in
 <b>18-MEDICAL.md</b> — in your private repo, <i>github.com/iamyoup/us-trip-2026-private</i>
 (sign in to view). ⚠️ No 24-hour pharmacy could be verified anywhere on this trip — Seattle's
 traditional 24-hour chain closed in 2025. Don't count on one at 2am.</div>
 <div class="note" style="margin-top:8px">🔴 <b>"Benadryl" is not what you think.</b> In India it's a
 cough syrup. In America every single product with that name is a <b>sedating antihistamine</b> —
 checked across all 32 US products. Giving it to your daughter for a cough would be a mistake.</div>
 <div class="note" style="margin-top:8px">Indian travel insurance is usually <b>reimbursement-based</b>:
 you pay first and claim later. Keep the itemised bill, the medical report and every receipt.</div>`},
 {h:"🍱 Food, sleep and tantrums — for your wife",b:`
 <b>Food on the flight — carry as much as you need.</b> Baby food, milk, formula and toddler drinks
 are <b>exempt from the 100 ml liquid rule</b> in India, Dubai and the US. Declare them at security
 rather than letting them be found. Ice packs allowed. Request a <b>baby meal AND a child meal</b> in
 Manage Booking 24–48h ahead — Emirates also warms bottles and provides sterilised water.<br><br>
 🔴 <b>The trap:</b> whatever food is left when you land in Boston <b>must be declared</b>. The fine
 for not declaring is <b>$300 first offence — even for food that would have been allowed.</b> The
 offence is the silence, not the food. Tick "yes", let them glance in the bag, walk on.<br><br>
 <b>So: pack homemade food to eat on the plane, sealed commercial packets for anything you want to
 still have in America.</b> Meat, fresh fruit and veg, and fresh dairy will be taken. Sealed dry
 snacks, spices, dal and baby food are fine.<br><br>
 <b>Once there it's easy.</b> Mayuri has two shops in Redmond; Patel Brothers is in Waltham near
 Boston. US supermarkets have huge baby-food aisles. Your Seattle hotel has a kitchen for the whole
 first week.<br><br>
 <b>😴 Sleep — 12.5 hours of shift, about 4–5 days to adjust.</b> Expect 2–4 a.m. wakefulness for the
 first two or three nights. The plan absorbs it: you land in Boston and stay put for five days with
 family and nothing scheduled. Morning daylight helps more than anything else. Hold the local bedtime
 from night one. Don't engage at 3 a.m. — low light, quiet, no play.<br><br>
 <b>Her nap is already protected</b> — the 14:20 slot at Niagara works for both girls. Keep the
 pattern everywhere: the one thing that matters in the morning, back to the room at ~13:00, something
 low-stakes late afternoon, nothing ambitious in the evening. <b>Stroller naps count.</b><br><br>
 ⚠️ <b>Reserve a cot at both hotels when you book</b> — free, but limited. Bring her own blanket;
 smell matters more than comfort at this age.<br><br>
 <b>😤 Tantrums — four causes, all predictable.</b> Hunger (feed on a schedule, before the meltdown),
 tiredness, being strapped in more than ~90 minutes, and over-stimulation. Distraction beats
 reasoning — she genuinely can't be reasoned with yet. Get low, hold her, or leave the space for 90
 seconds. Agree in advance who takes the next one.<br><br>
 <b>The danger points on this trip:</b> the Dubai transfer, Boston immigration at hour 20 (keep one
 new toy sealed for exactly that queue), the 21:07 Buffalo landing, and the 7 km New York day —
 which is the day to split up rather than all suffer together.`},
 {h:"🍼 Bringing your 18-month-old?",b:`
 <b>My recommendation: bring her.</b> The flight is one hard day; the separation is twenty-three, at
 the age when separation is hardest. And <b>15 of your 23 days are in family homes or a single
 hotel</b> with other adults around — the trip is friendlier than it looks.<br><br>
 <b>The honest counter-argument:</b> your wife would fly Hyderabad→Dubai→Boston <b>alone with a
 4-year-old and an infant in arms</b> — ~20 hours plus a Dubai transfer and US immigration. That's
 the real cost, and it's reason enough to decide the other way.<br><br>
 <b>Four things to do now if she comes</b>
 <div class="item"><b>📅 Check her exact date of birth</b>
 <div class="note">If she turns 2 during the trip, the return needs a <b>paid seat at child fare</b>
 — and Emirates' website can't process that mixed booking. You'd have to ring them.</div></div>
 <div class="item"><b>🍼 Request a bassinet</b>
 <div class="note">11 kg limit; an average 18-month-old is 10–11 kg, so it's borderline. Limited and
 first-come. If she fits, it transforms the flight.</div></div>
 <div class="item"><b>✈️ The seat fix becomes urgent</b>
 <div class="note">Your wife must hold the baby <i>and</i> sit beside your daughter. A stranger
 between them is untenable with two children.</div></div>
 <div class="item"><b>👵 Could her grandmother come?</b>
 <div class="note">If she has a visa, this solves the 20-hour flight outright and gives you a
 babysitter in New York. The highest-leverage change available.</div></div>
 <b>Cost is not the obstacle — about $250–350 all in.</b> US domestic lap infants fly <b>free</b>
 (verified, Delta and United). Emirates charges ~10% of the adult fare. Attractions are free at that
 age; hotel cots are free but must be reserved.<br><br>
 <b>The change I'd make:</b> cut New York from three nights to two, or drop it. A 7 km walking day,
 only a third of subway stations have lifts, and $475 a night for the days you'd enjoy least.`},

 queueing.</div></div>

 <div class="note">A 10-minute walk from the hotel — but it's the worst queue in the harbour, so take
 the <b>earliest sailing</b> and arrive before it opens.</div></div>
 <div class="note" style="margin-top:8px">Either way: <b>statuecitycruises.com</b> only — it's the
 sole authorised operator. $26 adult, $17 child 4–12, family of three $69. Free cancellation 24h+.
 <b>Crown is out</b> (42-inch minimum, 162 unaided steps); ask for <b>Pedestal</b> instead.</div>`},
 {h:"🏨 World Center Hotel vs Jersey City",b:`
 <b>144 Washington St is a genuinely strong option — quite possibly better than my Jersey City
 recommendation, especially if both children come.</b><br><br>
 <b>Why it's good</b><br>
 · <b>13 subway lines within a short walk</b> — 1, 2, 3, 4, 5, A, C, E, J, Z, R, W via Fulton Street
 and the Oculus. One of the best-connected spots in the city.<br>
 · <b>2 minutes from the 9/11 Memorial</b>, which is already on your Friday.<br>
 · <b>10 minutes from Battery Park</b> and the Statue of Liberty ferry.<br>
 · <b>PATH runs from the Oculus</b> to Jersey City <i>and</i> Newark — so your New Jersey friends and
 the Newark airport transfer both still work.<br>
 · Rooms are reported as <b>larger than typical New York</b>, some with kitchenettes, and family
 rooms with two queens. With small children that matters more than it sounds.<br><br>
 🔴 <b>The big win: it nearly solves the 7 km walking day.</b> Staying at the World Trade Center means
 the ferry, the memorial, the Oculus and your hotel are all within about a kilometre of each other.
 No river crossing at the start and end of every day, and you can go back to the room for a nap
 whenever you need to — which with a toddler is the whole game.<br><br>
 <b>What you'd give up</b><br>
 · ⚠️ <b>The Liberty State Park ferry trick.</b> That was my main reason for Jersey City — shorter
 queues on your own side of the river. From Manhattan you'd use <b>Battery Park instead, which has
 the worst queues in the harbour.</b> Mitigate it: book the <b>earliest sailing</b> and be there
 before it opens. Worth doing anyway with children.<br>
 · Journal Square's Indian food is no longer on your doorstep — but Curry Hill is a direct subway
 ride.<br>
 · The Financial District is <b>quiet at night and at weekends</b> — it's an office area. Fewer
 restaurants open late. With young children, probably a feature rather than a bug.<br><br>
 ✅ <b>UNGA is not a problem here.</b> The security zone is Midtown East, 42nd–48th St — about 6 km
 north. You're well clear of it.<br><br>
 <b>My verdict: take it if the price is within about $50/night of the Courtyard's $475.</b> Check the
 rate for 24–27 Sep before committing. Earlier research found Lower Manhattan competitive with Jersey
 City during UNGA week — the Fairfield Financial District came in at $467, cheaper than every Jersey
 City option.`},
 {h:"👶 Stroller for a 4-year-old? — it depends on the toddler",b:`
 <b>The honest answer changes completely depending on whether your 18-month-old comes.</b><br><br>
 <b>🅰️ If only your 4-year-old comes — yes, take one, but you'll use it on two days.</b><br>
 A typical 4-year-old walks 1–2 km happily and 3–4 km across a whole day with breaks.
 <b>The New York Friday is 7 km.</b> That's well beyond her, and the failure mode isn't her asking to
 stop — it's a meltdown at 5 p.m. two miles from the hotel.<br><br>
 But its real value at four isn't transport. It's <b>somewhere to nap, a bag trolley, and a place to
 put her the moment a queue appears.</b> Take a light umbrella fold, use it in New York and at
 Niagara, and leave it in the room the rest of the time.<br><br>
 ⚠️ <b>Check the weight rating before you buy.</b> She's 16 kg and many cheap umbrella strollers stop
 at 15–18 kg. You want one rated <b>20 kg or more</b> that stands up folded.<br><br>
 <b>🅱️ If both children come — the stroller goes to the baby, and that changes the plan, not the
 pushchair.</b><br>
 You cannot push two. A double or sit-and-stand is heavy, wide, and miserable on subway stairs — and
 only about a third of New York stations have a lift. <b>Don't solve this with equipment. Solve it by
 walking less.</b><br><br>
 <b>How to cut the New York Friday from 7 km to about 4</b>
 <div class="item"><b>Keep</b> the Statue of Liberty ferry — it's a boat, there's no walking, and it's
 the best thing you'll do that day</div>
 <div class="item"><b>Keep</b> the 9/11 memorial pools and the Oculus — they're next to each other,
 barely 300 m apart</div>
 <div class="item"><b>Cut</b> the Wall Street / Charging Bull / Trinity Church loop — about 1.5 km of
 walking for photographs of things a child doesn't care about</div>
 <div class="item"><b>Cut the Brooklyn Bridge crossing.</b> Take the subway to DUMBO, do the carousel
 and the sunset, and subway back. You keep the view and lose 2 km</div>
 <div class="note" style="margin-top:8px">Most of that day is ferry and subway — the <b>walking</b>
 is the islands (~1 km), memorial to Oculus (0.3), the Wall St loop (1.5), DUMBO (1) and the bridge
 (2), plus getting to and from stations. Cutting the last two roughly halves it, to about 3.5 km.
 That's the whole day still intact, minus the parts that are for adults.</div><br>
 <b>Where a stroller won't help either way</b><br>
 · 🔴 The <b>Space Needle bans them outright</b><br>
 · <b>Cave of the Winds</b> — wooden decks and stairs<br>
 · <b>Maid of the Mist</b> — fold it for the boat<br>
 · <b>New York subway stairs</b> — budget for carrying it, whatever you choose<br><br>
 ✅ It <b>gate-checks free</b> on every US airline, right at the aircraft door, and doesn't count
 against your baggage allowance.`},
 {h:"🚸 Two risks that are genuinely different here",b:`
 <b>Traffic comes from the LEFT.</b> Thirty years of looking right first is the reflex that gets
 Indian visitors hurt. Hold your daughter's hand at every kerb without exception.<br><br>
 <b>A car may legally cross your pedestrian signal.</b> Right-turn-on-red is permitted almost
 everywhere in the US — a driver turning right can legally move while your walk signal is green.
 Make eye contact with the driver before you step out.<br><br>
 <b>Ticks</b> in the White Mountains and rural New England in early October. Check her hairline,
 behind the ears and the backs of the knees after the 1 Oct foliage day.`},

 Embassy in Washington DC. Addresses are in <b>13-PRACTICALITIES.md</b> in your private repo —
 I've deliberately not copied the phone numbers here because I could only single-source them.</div>

 <i>github.com/iamyoup/us-trip-2026-private</i> — private, sign in to read. Deliberately not on
 this page, which is public.</div>`},
 {h:"🍽️ Food notes",b:`Veg and non-veg both fine, so treat every restaurant list as a floor not a ceiling.<br><br>
 🥇 <b>Niagara — the best logistical find of the trip.</b> Your hotel's own building holds three South
 Asian restaurants. <b>Murugan Cafe</b> (Unit 6) and <b>Delhi Chaat Corner</b> (Unit 7, pure veg,
 <b>open 08:30–23:00 every day</b>) are about 60 metres from the lobby — not the 8-minute walk I first
 said. That covers a late arrival, breakfast, and veg-only days without leaving the building.<br><br>
 <b>Seattle:</b> Dosa House (Bellevue) is open to <b>23:59 on Saturdays</b> — you land 18:25 on a
 Saturday. <b>Jack's BBQ opens 07:00</b> on weekdays, the only real answer to a 04:00 jet-lag wake-up.
 <span class="warn">Mayuri the restaurant is closed; Mayuri the grocery chain is thriving — two stores
 in Redmond.</span><br><br>
 <b>New York:</b> Curry Hill (Lexington & 28th), Jackson Heights (cheaper and better), Journal Square
 in Jersey City.<br>
 <b>Boston suburbs:</b> Patel Brothers at <b>425 Moody Street, Waltham</b> sits on the same block as
 the two best Indian restaurants in the suburbs. <b>Crystal Spoons</b> (Hyderabadi) is
 <b>reservation-only for dinner</b>; lunch is walk-in.<br><br>
 ⚠️ <b>Clam chowder is built on pork fat</b> — ask every time. In the US "vegetarian" can still include
 egg, and soups often use chicken or beef stock.<br><br>
 💡 Honest verdict: in early October the New England food worth your money is <b>apple cider donuts</b>,
 not a $35 lobster roll. And Oak Tree Road biryani won't satisfy a Hyderabad family — go for the
 chaat and the sweets instead.`}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Storage that cannot take the app down.
   Private mode throws on write; a corrupt value would throw on parse. Either
   would abort the whole script, because this is a single <script> block. */
const store={
  get(key,fallback){
    try{
      const raw=localStorage.getItem(key);
      if(raw==null) return fallback;
      const val=JSON.parse(raw);
      if(val===null||typeof val!==typeof fallback) return fallback;
      if(Array.isArray(fallback)!==Array.isArray(val)) return fallback;
      return val;
    }catch(e){
      try{ localStorage.removeItem(key); }catch(_){}
      return fallback;
    }
  },
  set(key,val){
    try{ localStorage.setItem(key,JSON.stringify(val)); return true; }
    catch(e){ return false; }
  },
  drop(key){ try{ localStorage.removeItem(key); }catch(e){} }
};
const mapURL=p=>"https://www.google.com/maps/search/?api=1&query="+
  encodeURIComponent(p.q?(p.n.split(" — ")[0]+", "+p.a):(p.a||p.n));

function placesFor(d){
  if(!d.pl) return [];
  return d.pl.map(n=>PLACES.find(p=>p.n.toLowerCase().includes(n.toLowerCase()))).filter(Boolean);
}
function routeURL(ps){
  if(ps.length<2) return null;
  const q=p=>encodeURIComponent(p.q?(p.n.split(" — ")[0]+", "+p.a):(p.a||p.n));
  const mid=ps.slice(1,-1).map(q).join("%7C");
  return "https://www.google.com/maps/dir/?api=1&origin="+q(ps[0])+
    "&destination="+q(ps[ps.length-1])+(mid?"&waypoints="+mid:"")+"&travelmode=walking";
}
function legsHTML(ps){
  if(ps.length<2) return "";
  let out="",total=0;
  for(let i=1;i<ps.length;i++){
    const km=haversine(ps[i-1].lat,ps[i-1].lon,ps[i].lat,ps[i].lon); total+=km;
    const mins=Math.round(km/5*60);
    out+=`<div class="leg">↓ ${km<1?Math.round(km*1000)+" m":km.toFixed(1)+" km"} · ~${mins} min walk</div>
      <div class="stop">${esc(ps[i].n)}</div>`;
  }
  return `<div class="route"><div class="stop">${esc(ps[0].n)}</div>${out}
    <div class="note" style="margin-top:7px">Total ${total.toFixed(1)} km on foot.
    Straight-line estimate — real walking is a bit further.</div></div>`;
}

function dayHTML(d,open){
  const items=d.i.map(it=>`<div class="item">
    ${it.t?`<span class="t">${esc(it.t)}</span>`:""}<b>${esc(it.x)}</b>
    ${it.n?`<div class="note">${esc(it.n)}</div>`:""}</div>`).join("");
  const ps=placesFor(d), url=routeURL(ps);
  const route=url?`<a class="map" style="display:block;text-align:center;margin:10px 0 4px"
      href="${url}" target="_blank" rel="noopener">🗺️ Open today's route in Maps</a>`+legsHTML(ps):"";
  const noteBox=`<div class="noteWrap">
      <textarea class="dayNote" data-d="${esc(d.d)}"
        placeholder="Your notes for this day — saved automatically on this device"></textarea>
      <span class="noteFlag" id="nf-${esc(d.d.replace(/[^a-z0-9]/gi,""))}"></span></div>`;
  return `<details class="day"${open?" open":""}>
    <summary><span><span class="when">${esc(d.r)}</span>${esc(d.d)} · ${esc(d.t)}</span></summary>
    <div class="body">${items}${route}${noteBox}</div></details>`;
}

/* day notes persist locally */
function wireNotes(root){
  const KEY="tripnotes";
  (root||document).querySelectorAll("textarea.dayNote").forEach(t=>{
    const day=t.dataset.d;
    t.value=(store.get(KEY,{})[day])||"";
    let timer=null;
    t.addEventListener("input",()=>{
      /* read fresh each time — a captured snapshot lets two textareas for the
         same day overwrite each other with stale copies */
      const notes=store.get(KEY,{});
      notes[day]=t.value;
      const ok=store.set(KEY,notes);
      document.querySelectorAll("textarea.dayNote").forEach(o=>{
        if(o!==t&&o.dataset.d===day) o.value=t.value;
      });
      const flag=document.getElementById("nf-"+day.replace(/[^a-z0-9]/gi,""));
      if(flag){
        flag.textContent=ok?"Saved ✓":"⚠️ Couldn't save — private browsing blocks it";
        flag.style.color=ok?"var(--good)":"var(--bad)";
        flag.style.opacity="1";
        clearTimeout(timer);
        timer=setTimeout(()=>{ flag.style.opacity="0"; },1800);
      }
    });
  });
}

})();

/* Today view */
/* Today is recomputed whenever you come back to the app.
   It is a home-screen app that will sit open overnight — computing the date
   once at load would show yesterday's plan every morning. */
function renderToday(){
  const el=document.getElementById("s-now");
  const now=new Date();
  const start=new Date(2026,8,12), end=new Date(2026,9,6,23,59);
  const pad=n=>String(n).padStart(2,"0");
  const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

  /* Map each real date to a DAY LABEL, not an array index — indices shift
     whenever a day is inserted, labels don't. */
  const DATEMAP={
    "2026-09-12":"Sat 12 Sep","2026-09-13":"Sun 13 Sep",
    "2026-09-14":"Mon 14 – Wed 16 Sep","2026-09-15":"Mon 14 – Wed 16 Sep",
    "2026-09-16":"Mon 14 – Wed 16 Sep","2026-09-17":"Thu 17 Sep",
    "2026-09-18":"Fri 18 Sep","2026-09-19":"Sat 19 Sep",
    "2026-09-20":"Sun 20 – Mon 21 Sep","2026-09-21":"Sun 20 – Mon 21 Sep",
    "2026-09-22":"Tue 22 Sep","2026-09-23":"Wed 23 Sep","2026-09-24":"Thu 24 Sep",
    "2026-09-25":"Fri 25 Sep","2026-09-26":"Sat 26 Sep","2026-09-27":"Sun 27 Sep",
    "2026-09-28":"Mon 28 Sep","2026-09-29":"Tue 29 – Wed 30 Sep",
    "2026-09-30":"Tue 29 – Wed 30 Sep","2026-10-01":"Thu 1 Oct","2026-10-02":"Fri 2 Oct",
    "2026-10-03":"Sat 3 Oct","2026-10-04":"Sun 4 Oct","2026-10-05":"Mon 5 Oct",
    "2026-10-06":"Mon 5 Oct"
  };

  let idx=-1, banner="";
  if(now<start){
    const days=Math.ceil((start-now)/864e5);
    banner=`<div class="card"><div class="k">Countdown</div>
      <div class="big">${days} day${days===1?"":"s"} to go</div>
      <div class="note">Trip starts Saturday 12 September 2026.</div></div>`;
    idx=0;
  } else if(now>end){
    banner=`<div class="card"><div class="big">Trip complete 🎉</div>
      <div class="note">Hope it was a good one. Everything's still here if you want to look back.</div></div>`;
  } else {
    const label=DATEMAP[key(now)];
    idx=label?DAYS.findIndex(d=>d.d===label):-1;
    banner=idx>=0
      ? `<div class="card"><div class="k">Today</div><div class="big">${esc(DAYS[idx].r)}</div></div>`
      : `<div class="card"><div class="k">Today</div><div class="big">Travel day</div>
         <div class="note">No specific plan for today — check All days.</div></div>`;
  }

  const upcoming=idx>=0?DAYS.slice(idx+1,idx+3):[];
  el.innerHTML=banner
    +(idx>=0?dayHTML(DAYS[idx],true):"")
    +(upcoming.length?`<div class="card"><h3>Next up</h3>${upcoming.map(d=>
      `<div class="item"><span class="when">${esc(d.r)}</span><b>${esc(d.d)}</b>
       <div class="note">${esc(d.t)}</div></div>`).join("")}</div>`:"");
  wireNotes(el);
}
renderToday();

/* ---------- MONEY ---------- */
(function(){
  const KEY="tripskip2";
  const skip=store.get(KEY,{});
  const m=n=>"$"+Math.round(n).toLocaleString("en-US");
  const inr=n=>"₹"+Math.round(n*FXRATE/1000)+"k";
  const el=document.getElementById("s-cost");

  /* Key each skippable line by its CONTENT, not its position.
     Positional keys silently reattach to a different line whenever the cost
     data is edited — which would corrupt the total without any visible sign. */
  const kOf=(si,ii)=>(COSTS.seg[si].n+"|"+COSTS.seg[si].i[ii][0])
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,80);

  const cost=(si,ii)=>skip[kOf(si,ii)]?0:COSTS.seg[si].i[ii][1];
  const segTotal=si=>COSTS.seg[si].i.reduce((a,_,ii)=>a+cost(si,ii),0);
  const personal=()=>COSTS.seg.reduce((a,s,si)=>a+(s.p?segTotal(si):0),0);
  const officeNow=()=>COSTS.seg.reduce((a,s,si)=>a+(s.p?0:segTotal(si)),0);

  function draw(){
    const wasOpen=new Set();
    el.querySelectorAll("details.day").forEach((d,i)=>{ if(d.open) wasOpen.add(i); });
    const p=personal(), off=officeNow(), spare=COSTS.officeBudget-off;
    const saved=COSTS.total-p;
    const warn=COSTS.seg.some((s,si)=>
      s.i.some((it,ii)=>it[2]==="visa"&&skip[kOf(si,ii)]));

    let h=`<div class="card">
      <div class="k">What you actually pay</div>
      <div class="big">${m(p)} <span class="k" style="font-weight:400">≈ ${inr(p)}</span></div>
      ${saved>0?`<div class="note good">You've skipped ${m(saved)} of the original ${m(COSTS.total)}.</div>`
                :`<div class="note">${esc(COSTS.note)}</div>`}
      <div class="note" style="margin-top:6px">Untick any line below to take it out of the total.</div>
    </div>`;

    if(warn) h+=`<div class="card" style="border-color:var(--bad)">
      <h3 class="bad">⚠️ You've unticked the UK visa</h3>
      <div class="note" style="color:var(--text)">This isn't a cost you can choose to avoid.
      Britain scrapped transit-without-visa in Feb 2026, and it covered <b>airside</b> transit —
      so waiting in a lounge doesn't get around it. British Airways would refuse to board you
      <b>in Hyderabad</b>.<br><br>
      The cheaper legitimate route is a <b>Direct Airside Transit Visa, £41.50 each way (£83)</b>
      instead of the £135 Standard Visitor visa — but priority processing is rarely offered for it,
      and standard processing returns a decision after your flight has gone.</div></div>`;

    h+=`<div class="card">
      <h3>💼 Your office week</h3>
      <div class="note" style="color:var(--text)">
        Budget <b>${m(COSTS.officeBudget)}</b> for 12–19 Sep · spend <b>${m(off)}</b><br>
        <span class="${spare>=0?'good':'bad'}">${spare>=0?m(spare)+" to spare":m(-spare)+" over"}</span>
      </div>
      <div class="note">⚠️ Check it also covers the family's food on 17–18 Sep — if not, add about $110.</div>
    </div>`;

    const maxSeg=Math.max(...COSTS.seg.map((_,si)=>segTotal(si)),1);
    h+=`<div class="card"><h3>Where it goes</h3>`;
    COSTS.seg.forEach((s,si)=>{
      const v=segTotal(si); if(!v) return;
      h+=`<div class="item"><b>${esc(s.n)}</b><span style="float:right" class="dist">${m(v)}</span>
        <div style="background:var(--card2);border-radius:4px;height:6px;margin-top:6px">
        <div style="background:var(--accent);height:6px;border-radius:4px;width:${Math.round(v/maxSeg*100)}%"></div>
        </div></div>`;
    });
    h+=`</div><h3 style="margin:18px 0 8px;font-size:15px">Tap any line to skip it</h3>`;

    COSTS.seg.forEach((s,si)=>{
      const items=s.i.map((it,ii)=>{
        const off=!!skip[kOf(si,ii)];
        return `<label class="chk money${off?" on":""}" data-k="${esc(kOf(si,ii))}">
          <input type="checkbox" ${off?"":"checked"}>
          <span>${esc(it[0])}</span>
          <b class="${it[1]===0?'good':''}" style="margin-left:auto;white-space:nowrap">
            ${it[1]===0?'free':m(it[1])}</b></label>`;
      }).join("");
      h+=`<details class="day"><summary>
        <span><span class="when">${esc(s.w)}</span>${esc(s.n)}</span>
        <span class="dist">${m(segTotal(si))}</span></summary>
        <div class="body">${items}</div></details>`;
    });

    h+=`<div class="card"><h3>Levers you haven't pulled yet</h3>`;
    COSTS.lever.forEach(([n,v])=>{
      const done=String(v).includes("already");
      h+=`<div class="item"><b>${esc(n)}</b>
        <span style="float:right" class="${done?'good':'dist'}">${typeof v==="number"?m(v):esc("$"+v)}</span></div>`;
    });
    h+=`</div>
    <div class="card"><h3>Already paid</h3>
      <div class="note" style="color:var(--text)">Family Emirates return — ₹1,89,394<br>
      Emirates seat selection — ₹10,624<br>Your British Airways return — not supplied</div></div>
    <div class="card"><button id="resetSkip" style="width:100%;padding:11px;border:1px solid var(--line);
      border-radius:9px;background:var(--card2);color:var(--dim);font-size:14px">Put everything back</button>
      <div class="note" style="margin-top:8px">Hotels and flights are verified where possible; food and
      local transport are estimates. Converted at about ₹88 to the dollar.</div></div>`;

    el.innerHTML=h;
    el.querySelectorAll("details.day").forEach((d,i)=>{ if(wasOpen.has(i)) d.open=true; });
    if(window.__spendRedraw) window.__spendRedraw();
    el.querySelectorAll("label.money").forEach(l=>{
      l.onclick=e=>{
        if(e.target.tagName!=="INPUT") e.preventDefault();
        const k=l.dataset.k; skip[k]=!skip[k];
        store.set(KEY,skip); draw();
      };
    });
    const r=el.querySelector("#resetSkip");
    if(r) r.onclick=()=>{
      if(!confirm("Put every skipped line back into the total?")) return;
      Object.keys(skip).forEach(k=>delete skip[k]);
      store.set(KEY,skip); draw(); };
  }
  draw();
})();

/* ---------- CHECKLIST ---------- */
(function(){
  const KEY="tripcheck";
  const state=store.get(KEY,{});
  const el=document.getElementById("s-check");

  function draw(){
    let done=0,total=0;
    let h="";
    Object.entries(CHECK).forEach(([group,items])=>{
      let gh="";
      items.forEach(t=>{
        const id=group+"|"+t; total++;
        const on=!!state[id]; if(on)done++;
        gh+=`<label class="chk${on?" on":""}" data-id="${esc(id)}">
          <input type="checkbox" ${on?"checked":""}><span>${esc(t)}</span></label>`;
      });
      h+=`<div class="card"><h3>${esc(group)}</h3>${gh}</div>`;
    });
    const pct=total?Math.round(done/total*100):0;
    el.innerHTML=`<div class="card"><div class="k">Progress</div>
      <div class="big">${done} of ${total} done</div>
      <div style="background:var(--card2);border-radius:5px;height:9px;margin-top:9px">
      <div style="background:var(--good);height:9px;border-radius:5px;width:${pct}%"></div></div>
      <div class="note" style="margin-top:8px">Ticks are saved on this device.</div></div>`+h+
      `<div class="card"><button id="resetChk" style="width:100%;padding:11px;border:1px solid var(--line);
        border-radius:9px;background:var(--card2);color:var(--dim);font-size:14px">Clear all ticks</button></div>`;

    el.querySelectorAll("label.chk").forEach(l=>{
      l.onclick=e=>{
        if(e.target.tagName!=="INPUT") e.preventDefault();
        const id=l.dataset.id;
        state[id]=!state[id];
        if(!store.set(KEY,state)){
          alert("Couldn't save that tick — your browser is blocking storage. Private browsing does this.");
        }
        draw();
      };
    });
    const r=el.querySelector("#resetChk");
    if(r) r.onclick=()=>{
      if(!confirm("Clear every tick on this list? This cannot be undone.")) return;
      Object.keys(state).forEach(k=>delete state[k]);
      store.set(KEY,state); draw(); };
  }
  draw();
})();

/* ---------- SPEND TRACKER ---------- */
(function(){
  const KEY="tripspend";
  let log=store.get("tripspend",[]);
  const host=document.createElement("div");
  const cost=document.getElementById("s-cost");
  cost.parentNode.insertBefore(host,cost);
  host.id="spendHost";

  const m=n=>"$"+Math.round(n).toLocaleString("en-US");

  /* the planned figure must reflect anything unticked in the Money tab */
  function plannedNow(){
    const skip=store.get("tripskip2",{});
    const kOf=(s,it)=>(s.n+"|"+it[0]).toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,80);
    return COSTS.seg.reduce((a,s)=>a+(s.p
      ? s.i.reduce((x,it)=>x+(skip[kOf(s,it)]?0:it[1]),0) : 0),0);
  }

  function draw(){
    const total=log.reduce((a,e)=>a+e.a,0);
    const planned=plannedNow();
    const pct=Math.min(100,Math.round(total/planned*100));
    host.innerHTML=`<div class="card">
      <div class="k">Spent so far</div>
      <div class="big">${m(total)} <span class="k" style="font-weight:400">of ${m(planned)} planned</span></div>
      <div style="background:var(--card2);border-radius:5px;height:9px;margin-top:9px">
        <div style="background:${total>planned?'var(--bad)':'var(--good)'};height:9px;border-radius:5px;width:${pct}%"></div></div>
      <div class="note" style="margin-top:8px">${total>planned
        ? '<span class="bad">Over the plan by '+m(total-planned)+'</span>'
        : m(planned-total)+' left'}</div>
    </div>
    <div class="card"><h3>Log a spend</h3>
      <div style="display:flex;gap:7px">
        <input id="spAmt" type="number" inputmode="decimal" placeholder="$"
          style="width:96px;padding:11px;border-radius:9px;border:1px solid var(--line);
          background:var(--card2);color:var(--text);font-size:16px">
        <input id="spWhat" type="text" placeholder="What for?"
          style="flex:1;padding:11px;border-radius:9px;border:1px solid var(--line);
          background:var(--card2);color:var(--text);font-size:16px">
      </div>
      <button id="spAdd" style="width:100%;margin-top:8px;padding:12px;border:0;border-radius:9px;
        background:var(--accent);color:#08131f;font-weight:800;font-size:15px">Add</button>
    </div>`+
    (log.length?`<div class="card"><h3>Recent</h3>${
      log.slice().reverse().slice(0,25).map(e=>
        `<div class="item"><b>${esc(e.w||"—")}</b>
         <span style="float:right" class="dist">${m(e.a)}</span>
         <div class="note">${esc(e.d)} · <span class="del" data-id="${esc(e.id)}"
           style="color:var(--bad);cursor:pointer">remove</span></div></div>`).join("")}
      </div>`:"");

    const amt=host.querySelector("#spAmt"), what=host.querySelector("#spWhat"),
          add=host.querySelector("#spAdd");
    if(!amt||!what||!add) return;
    add.onclick=()=>{
      const a=parseFloat(amt.value);
      if(!a||a<=0){ amt.focus(); return; }
      log.push({id:Date.now(),a,w:what.value.trim(),
        d:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"})});
      store.set(KEY,log); draw();
    };
    what.addEventListener("keydown",e=>{ if(e.key==="Enter") add.click(); });
    host.querySelectorAll(".del").forEach(d=>{
      d.onclick=()=>{
        if(!confirm("Remove this entry?")) return;
        log=log.filter(e=>String(e.id)!==d.dataset.id);
        store.set(KEY,log); draw(); };
    });
  }
  draw();
  window.__spendRedraw=draw;
  /* Tie visibility to the Money tab. The Near me button switches tabs without
     going through a nav click, so watch the section itself rather than the
     buttons — otherwise the tracker leaks onto Near me. */
  const sync=()=>{ host.style.display=cost.classList.contains("on")?"block":"none"; };
  sync();
  if(window.MutationObserver){
    new MutationObserver(sync).observe(cost,{attributes:true,attributeFilter:["class"]});
  }
  document.querySelectorAll("nav button").forEach(b=>{
    const prev=b.onclick;
    b.onclick=e=>{ if(prev) prev(e); setTimeout(sync,0); };
  });
})();

/* ---------- NEAR ME ---------- */
function haversine(a,b,c,d){
  const R=6371,p=Math.PI/180;
  const x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const btn=document.getElementById("nearBtn");
let lastPos=null, nearCat="All";

function drawNear(){
  const out=document.getElementById("s-near");
  if(!lastPos){ return; }
  const {la,lo}=lastPos;
  const cats=["All",...[...new Set(PLACES.map(p=>p.c))].sort()];
  const chips=cats.map(c=>`<button class="fchip${c===nearCat?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const pool=PLACES.filter(p=>nearCat==="All"||p.c===nearCat)
    .map(p=>({...p,km:haversine(la,lo,p.lat,p.lon)}))
    .sort((x,y)=>x.km-y.km);
  const near=pool.filter(p=>p.km<=60).slice(0,15);
  const far=near.length?null:pool[0];

  out.innerHTML=`<div class="card"><div class="k">Your location</div>
    <div class="note">${la.toFixed(3)}, ${lo.toFixed(3)}</div></div>
    <div class="chips">${chips}</div>`+
    (near.length?near.map(p=>{
      const d=p.km<1?`${Math.round(p.km*1000)} m`:`${p.km.toFixed(1)} km`;
      return `<div class="card"><h3>${esc(p.n)}</h3>
        <div class="k"><span class="pill">${esc(p.c)}</span><span class="dist">${d} away</span></div>
        <div class="note">${esc(p.a)}${p.q?' <span class="warn">· confirm the exact address in Maps</span>':''}</div>
        <a class="map" href="${mapURL(p)}" target="_blank" rel="noopener">Open in Maps ↗</a></div>`;
    }).join("")
    :`<div class="empty">Nothing from your plan is within 60 km.<br><br>
       ${far?`The nearest is <b>${esc(far.n)}</b>, about ${Math.round(far.km)} km away — so you're
       probably not in that part of the trip yet.`:"No places in this category."}</div>`);

  out.querySelectorAll(".fchip").forEach(b=>{
    b.onclick=()=>{ nearCat=b.dataset.c; drawNear(); window.scrollTo(0,0); };
  });
}

btn.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));
  document.querySelector('nav button[data-t="s-near"]').classList.add("on");
  const out=document.getElementById("s-near"); out.classList.add("on"); window.scrollTo(0,0);
  if(!navigator.geolocation){
    out.innerHTML='<div class="empty">This browser has no location support.</div>'; return;
  }
  out.innerHTML='<div class="empty">Getting your location…</div>';
  btn.disabled=true; btn.textContent="Locating…";
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.disabled=false; btn.textContent="📍 Near me";
    lastPos={la:pos.coords.latitude,lo:pos.coords.longitude};
    drawNear();
  },err=>{
    btn.disabled=false; btn.textContent="📍 Near me";
    out.innerHTML=`<div class="empty">Couldn't get your location.<br><br>
      <span class="warn">${esc(err.message)}</span><br><br>
      Most likely you declined the permission. In Chrome tap the ⋮ menu, then Settings, Site settings, Location, and allow it for this page. Then tap Near me again.</div>`;
  },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
};
</script>
</body>
</html>
